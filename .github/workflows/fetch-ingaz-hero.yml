name: Fetch Ingaz hero image

on:
  push:
    paths:
      - '.github/workflows/fetch-ingaz-hero.yml'

permissions:
  contents: write

jobs:
  fetch-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download original hero image
        shell: bash
        run: |
          set -euo pipefail
          OUT='public/images/sections/ingaz-main-hero.jpg'
          URL='https://ingazfawry.com/wp-content/uploads/2026/02/%D9%85%D9%83%D8%AA%D8%A8-%D8%AA%D8%AC%D9%86%D9%8A%D8%B3.jpg'
          mkdir -p "$(dirname "$OUT")"
          curl -fL --retry 4 --retry-delay 2 -A 'Mozilla/5.0' "$URL" -o "$OUT"
          test -s "$OUT"
          BYTES=$(stat -c%s "$OUT")
          test "$BYTES" -gt 20000
          file "$OUT"
          echo "Downloaded $BYTES bytes"

      - name: Use downloaded image in homepage hero
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text(encoding='utf-8')
          old = 'src="/images/sections/hero-saudi-office.webp"'
          new = 'src="/images/sections/ingaz-main-hero.jpg"'
          if old not in s:
              raise SystemExit('Hero source marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit image and homepage update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/sections/ingaz-main-hero.jpg app/page.tsx
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Use original Ingaz homepage hero image locally'
          git push origin HEAD:main
